services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: inpi
      POSTGRES_USER: inpi
      POSTGRES_PASSWORD: inpi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inpi -d inpi"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - inpi_pgdata:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://inpi:inpi@db:5432/inpi
      APP_ENV: dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  inpi_pgdata:
