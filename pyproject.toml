[project]
name = "inpi-mcp-mvp"
version = "0.2.0"
description = "Infraestrutura auditavel para pesquisa, comparacao e ingestao de marcas do INPI via API e MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.2",
  "rapidfuzz>=3.9",
  "Unidecode>=1.3",
]

[project.scripts]
inpi-mcp = "app.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1,<2"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
